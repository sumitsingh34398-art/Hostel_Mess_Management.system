<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart QR Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body style="background-image: url('{{ url_for('static', filename='images/hostel_bg.jpg') }}');">
    <div style="width: 90%; margin: auto; padding-top: 20px;">
        <div style="display: flex; justify-content: space-between; align-items: center; background: rgba(17,24,39,0.9); padding: 15px 30px; border-radius: 12px; border: 1px solid #d4af37;">
            <h2>Smart QR Dashboard</h2>
            <a href="/logout"><button style="width: auto; padding: 8:px 20px;">Logout</button></a>
        </div>

        <div style="display: flex; gap: 30px; margin-top: 30px;">
            <div class="glass-card" style="text-align: center; flex: 1;">
                <h3>Mess QR Code</h3>
                <img src="/generate_qr" alt="QR Code" width="220" style="border-radius: 10px; background: #fff; padding: 10px;">
                <p style="color: #d4af37; margin-top: 10px;">Scan to open Mess Form & Pay</p>
                <a href="/form" target="_blank"><button>Open Student Form Link</button></a>
            </div>

            <div class="glass-card" style="flex: 2; width: auto;">
                <h3>Live Records</h3>
                <table>
                    <tr>
                        <th>Timestamp</th>
                        <th>Name</th>
                        <th>Room/No</th>
                        <th>Floor</th>
                        <th>Amount</th>
                    </tr>
                    {% for r in records %}
                    <tr>
                        <td>{{ r[0] }}</td>
                        <td>{{ r[1] }}</td>
                        <td>{{ r[2] }}</td>
                        <td>{{ r[3] }}</td>
                        <td>₹{{ r[5] }}</td>
                    </tr>
                    {% endfor %}
                </table>
            </div>
        </div>
    </div>
</body>
</html>
