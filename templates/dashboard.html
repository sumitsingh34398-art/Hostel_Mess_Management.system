<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart QR Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="background-image: url('images/hostel_bg.jpg');">
    <div style="width: 92%; max-width: 1200px; margin: auto; padding-top: 20px;">
        <div style="display: flex; justify-content: space-between; align-items: center; background: rgba(17,24,39,0.9); padding: 15px 30px; border-radius: 12px; border: 1px solid #d4af37; flex-wrap: wrap; gap: 10px;">
            <h2 style="color: #d4af37; margin:0; font-size: 20px;">Smart QR Dashboard</h2>
            <a href="index.html"><button class="btn-dark" style="padding: 8px 20px; margin:0;">Logout</button></a>
        </div>

        <div style="display: flex; gap: 30px; margin-top: 30px; flex-wrap: wrap;">
            <div class="glass-card" style="text-align: center; flex: 1; margin:0;">
                <h3 style="color: #d4af37;">Mess Hostel Fees QR Code</h3>
                <div style="background: #fff; padding: 10px; display: inline-block; border-radius: 10px; margin-top: 10px;">
                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=https://github.com" alt="QR Code">
                </div>
                <p style="color: #9ca3af; margin-top: 10px; font-size: 14px;">Scan to open Mess Form & Pay</p>
                <a href="form.html" target="_blank"><button class="btn-gold" style="width: 100%; justify-content: center;">Open Student Form Link</button></a>
            </div>

            <div class="glass-card" style="flex: 2; margin:0; width: auto;">
                <h3 style="color: #d4af37; margin-top:0;">Live Records</h3>
                <div style="overflow-x: auto;">
                    <table>
                        <tr>
                            <th>Timestamp</th>
                            <th>Name</th>
                            <th>Mobile</th>
                            <th>Room</th>
                            <th>Month</th>
                            <th>Amount</th>
                        </tr>
                        <tr>
                            <td>30 Jul 2026 | 01:15 PM</td>
                            <td>Rahul Kumar</td>
                            <td>9876543210</td>
                            <td>A-203</td>
                        <td>August</td>
                            <td>₹1500</td>
                        </tr>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
