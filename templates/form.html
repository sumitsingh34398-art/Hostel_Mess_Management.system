<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hostel Mess Bill Form</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body style="background-image: url('{{ url_for('static', filename='images/hostel_bg.jpg') }}');">
    <div class="glass-card">
        <h2 style="text-align: center; color: #d4af37;">HOSTEL MESS BILL FORM</h2>
        <p style="text-align: center; color: #9ca3af; font-size: 14px;">Fill the details below to generate mess bill slip</p>
        
        <form action="/form" method="POST">
            <label>Student Full Name:</label>
            <input type="text" name="name" placeholder="Enter student full name" required>
            
            <label>Mobile Number:</label>
            <input type="text" name="mobile" placeholder="Enter 10-digit mobile number" required>
            
            <label>Room Number:</label>
            <input type="text" name="room" placeholder="Enter room number" required>
            
            <label>Floor / Block:</label>
            <select name="floor">
                <option value="Ground Floor">Ground Floor</option>
                <option value="1st Floor">1st Floor</option>
                <option value="2nd Floor">2nd Floor</option>
            </select>
            
            <label>Month / Meal Type:</label>
            <select name="month">
                <option value="January">January Mess Bill</option>
                <option value="February">February Mess Bill</option>
                <option value="March">March Mess Bill</option>
                <option value="April">April Mess Bill</option>
                <option value="May">May Mess Bill</option>
                <option value="June">June Mess Bill</option>
                <option value="July" selected>July Mess Bill</option>
                <option value="August">August Mess Bill</option>
                <option value="September">September Mess Bill</option>
                <option value="October">October Mess Bill</option>
                <option value="November">November Mess Bill</option>
                <option value="December">December Mess Bill</option>
            </select>

            <label>Amount (₹):</label>
            <input type="number" name="amount" value="1500" required>
            
            <button type="submit">Generate Slip & Pay</button>
        </form>
    </div>
</body>
</html>
